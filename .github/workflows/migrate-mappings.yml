name: Migrate Yarn sources to Mojang mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.ref_name == 'arena/6a5c03e6-smp-market-flipper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the active Arena branch
        uses: actions/checkout@v6
        with:
          ref: arena/6a5c03e6-smp-market-flipper
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Migrate main sources to Mojang mappings on 1.21.11
        run: ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup

      - name: Migrate split client sources to Mojang mappings on 1.21.11
        run: ./gradlew migrateClientMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup

      - name: Select official mappings before changing Minecraft versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build.gradle")
          text = path.read_text()
          old = '    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"'
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one Yarn mappings dependency")
          path.write_text(text.replace(old, "    mappings loom.officialMojangMappings()"))
          PY

      - name: Commit the mechanical mapping migration on the active branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/client/java src/test/java build.gradle
          if git diff --cached --quiet; then
            echo "No source mapping changes were produced."
            exit 1
          fi
          git commit -m "Migrate Minecraft sources to Mojang mappings"
          git push origin HEAD:arena/6a5c03e6-smp-market-flipper

      - name: Compile and run tests on the 1.21.11 intermediate state
        run: ./gradlew test build --no-daemon
