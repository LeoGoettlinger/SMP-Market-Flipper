name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migrate-yarn-to-mojmap:
    if: github.event_name == 'push' && github.ref_name == 'arena/6a5c03e6-smp-market-flipper' && contains(github.event.head_commit.message, '[migrate-mappings]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the active Arena branch
        uses: actions/checkout@v6
        with:
          ref: arena/6a5c03e6-smp-market-flipper
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Migrate Yarn sources before changing Minecraft versions
        run: |
          set -o pipefail
          {
            ./gradlew --write-verification-metadata sha256 migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup
            ./gradlew --write-verification-metadata sha256 migrateClientMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup
          } 2>&1 | tee "$RUNNER_TEMP/scmarket-migration.log"

      - name: Switch the build to official mappings and preserve the migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build.gradle")
          text = path.read_text()
          old = '    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"'
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one Yarn mappings dependency")
          path.write_text(text.replace(old, "    mappings loom.officialMojangMappings()"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/client/java build.gradle gradle/verification-metadata.xml
          git commit -m "Migrate Minecraft sources to Mojang mappings"
          git push origin HEAD:arena/6a5c03e6-smp-market-flipper

      - name: Compile and run tests on the 1.21.11 Mojang-mapped intermediate state
        run: |
          set -o pipefail
          ./gradlew test build --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/scmarket-migration.log"

      - name: Preserve migration/build diagnostics on failure
        if: failure()
        run: |
          mkdir -p .ci
          tail -n 240 "$RUNNER_TEMP/scmarket-migration.log" > .ci/last-mapping-migration-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-mapping-migration-failure.txt gradle/verification-metadata.xml
          git commit -m "CI: preserve mapping migration diagnostics" || true
          git push origin HEAD:arena/6a5c03e6-smp-market-flipper || true

  test-and-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build the mod
        run: |
          set -o pipefail
          ./gradlew --write-verification-metadata sha256 test build --no-daemon 2>&1 | tee "$RUNNER_TEMP/scmarket-gradle.log"

      - name: Persist refreshed dependency verification checksums
        if: success() && github.event_name == 'push' && github.ref_name == 'arena/6a5c03e6-smp-market-flipper'
        run: |
          git add gradle/verification-metadata.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update verified dependency checksums"
            git push origin HEAD:arena/6a5c03e6-smp-market-flipper
          fi

      - name: Preserve failure diagnostics for the active Arena branch
        if: failure() && github.event_name == 'push' && github.ref_name == 'arena/6a5c03e6-smp-market-flipper'
        run: |
          mkdir -p .ci
          tail -n 180 "$RUNNER_TEMP/scmarket-gradle.log" > .ci/last-build-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-build-failure.txt gradle/verification-metadata.xml
          git commit -m "CI: preserve Gradle failure diagnostics"
          git push origin HEAD:arena/6a5c03e6-smp-market-flipper
