name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build the mod
        run: |
          set -o pipefail
          ./gradlew --write-verification-metadata sha256 test build --no-daemon 2>&1 | tee "$RUNNER_TEMP/scmarket-gradle.log"

      - name: Upload built mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sc-market-${{ github.sha }}
          path: |
            build/libs/sc-market-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Launch the 26.2 client and render SC-Market GUI to validate mixins
        run: |
          set -o pipefail
          timeout --signal=TERM 180s xvfb-run -a env SCMARKET_CI_SMOKE_TEST=true LIBGL_ALWAYS_SOFTWARE=1 ./gradlew runClient --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/scmarket-gradle.log"

      - name: Persist refreshed dependency verification checksums
        if: success() && github.event_name == 'push' && github.ref_name == 'arena/6a5c03e6-smp-market-flipper'
        run: |
          git add gradle/verification-metadata.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update verified dependency checksums"
            git push origin HEAD:arena/6a5c03e6-smp-market-flipper
          fi

      - name: Preserve failure diagnostics for the active Arena branch
        if: failure() && github.event_name == 'push' && github.ref_name == 'arena/6a5c03e6-smp-market-flipper'
        run: |
          mkdir -p .ci
          tail -n 180 "$RUNNER_TEMP/scmarket-gradle.log" > .ci/last-build-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-build-failure.txt gradle/verification-metadata.xml
          git commit -m "CI: preserve Gradle failure diagnostics"
          git push origin HEAD:arena/6a5c03e6-smp-market-flipper
